[theme]
base = "dark"
primaryColor = "#7C3AED"
font = "sans serif"
baseRadius = "medium"
showWidgetBorder = true

[theme.dark]
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#12151C"
